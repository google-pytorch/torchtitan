name: nightly-torchtitan-image

on:
  workflow_dispatch:
    inputs:
      torch_tpu_ref:
        description: 'Branch, tag, or commit SHA of torch_tpu to checkout'
        required: false
        default: 'main'
      torch_version:
        description: 'PyTorch nightly version to build against (e.g. 2.16.0.dev20261027). Empty uses the pin in env.TORCH_VERSION.'
        required: false
        default: ''
      push_image:
        description: 'Push the image to GAR'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "0 9 * * *" # 01:00 PST / 09:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.torch_tpu_ref || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  # Pinned PyTorch nightly. Both the torch_tpu wheel build and the image install
  # this exact version. Bump it once torch_tpu builds against a newer nightly.
  # Last known good: 2.16.0.dev20261027 (dev20261028 added Float8_e5m3fnu,
  # which torch_tpu's csrc/common/to_string.cc does not handle yet).
  TORCH_VERSION: ${{ github.event.inputs.torch_version || '2.16.0.dev20261027' }}

jobs:
  build-wheel:
    name: Build torch_tpu wheel from source against PyTorch Nightly
    runs-on: linux-x86-n4-16
    outputs:
      torch_tpu_sha: ${{ steps.torch_tpu_sha.outputs.sha }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996"
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout torchtitan repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Checkout torch_tpu repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: google-pytorch/torch_tpu
          path: torch_tpu
          token: ${{ secrets.TORCH_TPU_PAT }}
          ref: ${{ github.event.inputs.torch_tpu_ref || 'main' }}
          persist-credentials: false

      - name: Get torch_tpu commit SHA
        id: torch_tpu_sha
        run: |
          SHA=$(git -C torch_tpu rev-parse --short=7 HEAD)
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download PyTorch Nightly CPU Wheel
        run: |
          mkdir -p torch_tpu/dist
          pip install --upgrade pip
          pip download --no-deps --pre "torch==${TORCH_VERSION}" \
            --index-url https://download.pytorch.org/whl/nightly/cpu \
            --only-binary=:all: \
            --python-version "${PYTHON_VERSION}" \
            --implementation cp \
            -d torch_tpu/dist
          TORCH_WHEEL=$(ls $(pwd)/torch_tpu/dist/torch-*.whl | head -n 1)
          echo "TORCH_SOURCE=$TORCH_WHEEL" >> $GITHUB_ENV
          echo "Using TORCH_SOURCE=$TORCH_WHEEL"

      - name: Build TorchTPU wheel via Bazel
        run: |
          cd torch_tpu
          bazel build -c opt //ci/wheel:torch_tpu_wheel \
            --config=wheel_common \
            --config=local_torch \
            --repo_env=HERMETIC_PYTHON_VERSION="${PYTHON_VERSION}" \
            --define PYTHON_VERSION="${PYTHON_VERSION}" \
            --repo_env=TORCH_SOURCE=$TORCH_SOURCE

      - name: Upload compiled torch_tpu wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: torch-tpu-wheel-from-torch-nightly
          path: torch_tpu/bazel-bin/ci/wheel/torch_tpu-*.whl
          retention-days: 1

  build-and-push-image:
    name: Build and push nightly TorchTitan TPU image
    needs: [build-wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      candidate_ref: ${{ steps.ref.outputs.image_ref }}
      promote_latest: ${{ steps.meta.outputs.promote_latest }}
    defaults:
      run:
        shell: bash
    env:
      IMAGE_REPO: us-west1-docker.pkg.dev/tpu-pytorch/torchtitan-images/torchtitan-container

    steps:
      - name: Checkout torchtitan repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Validate required secrets and auth config
        env:
          GAR_JSON_KEY: ${{ secrets.GAR_JSON_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${GAR_JSON_KEY}" ]]; then
            echo "Missing required secret: GAR_JSON_KEY"
            exit 1
          fi
          if [[ -z "${HF_TOKEN}" ]]; then
            echo "Missing required secret: HF_TOKEN"
            exit 1
          fi

      - name: Download torch_tpu wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: torch-tpu-wheel-from-torch-nightly
          path: .

      - name: Authenticate to Google Cloud via service account key
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          credentials_json: ${{ secrets.GAR_JSON_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2

      - name: Configure Docker auth for GAR
        run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Compute image tags and labels
        id: meta
        run: |
          set -euo pipefail

          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          NIGHTLY_DATE=$(date -u +%Y-%m-%d)
          TORCH_TPU_SHA="${NEEDS_BUILD_WHEEL_OUTPUTS_TORCH_TPU_SHA}"
          TORCH_TPU_REF="${INPUT_TORCH_TPU_REF}"
          TORCHITAN_REF="${GITHUB_REF_NAME}"

          # Sanitize ref names
          SAFE_TORCH_TPU_REF=$(echo "${TORCH_TPU_REF}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          SAFE_TORCHITAN_REF=$(echo "${TORCHITAN_REF}" | sed 's/[^a-zA-Z0-9._-]/-/g')

          IS_CUSTOM=false
          if [[ "${TORCH_TPU_REF}" != "main" ]] || [[ "${TORCHITAN_REF}" != "main" ]]; then
            IS_CUSTOM=true
          fi

          # We do not tag with :latest here, we promote an image from candidate
          # to latest after it passes OSS CI suite in promote-latest job
          if [ "$IS_CUSTOM" = "true" ]; then
            CANDIDATE_TAG="${IMAGE_REPO}:torch-tpu-${SAFE_TORCH_TPU_REF}-torchtitan-${SAFE_TORCHITAN_REF}"
            {
              echo "tags<<EOF"
              echo "${CANDIDATE_TAG}"
              echo "EOF"
              echo "candidate_tag=${CANDIDATE_TAG}"
              echo "promote_latest=false"
            } >> "${GITHUB_OUTPUT}"
          else
            CANDIDATE_TAG="${IMAGE_REPO}:${NIGHTLY_DATE}"
            {
              echo "tags<<EOF"
              echo "${CANDIDATE_TAG}"
              echo "${IMAGE_REPO}:torchtitan-commit-${SHORT_SHA}"
              echo "${IMAGE_REPO}:torch-tpu-commit-${TORCH_TPU_SHA}"
              echo "EOF"
              echo "NIGHTLY_DATE=${NIGHTLY_DATE}"
              echo "candidate_tag=${CANDIDATE_TAG}"
              echo "promote_latest=true"
            } >> "${GITHUB_OUTPUT}"
          fi

          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.title=torchtitan-tpu-nightly"
            echo "org.opencontainers.image.description=Nightly TorchTitan TPU image built from source against PyTorch Nightly"
            echo "torchtitan.branch=${TORCHITAN_REF}"
            echo "torch_tpu.branch=${TORCH_TPU_REF}"
            echo "torch.version=${TORCH_VERSION}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
        env:
          NEEDS_BUILD_WHEEL_OUTPUTS_TORCH_TPU_SHA: ${{ needs.build-wheel.outputs.torch_tpu_sha }}
          INPUT_TORCH_TPU_REF: ${{ github.event.inputs.torch_tpu_ref || 'main' }}

      - name: Download HuggingFace Tokenizers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub requests tqdm
          python3 scripts/download_hf_assets.py --repo_id meta-llama/Llama-3.1-8B --assets tokenizer --hf_token="${HF_TOKEN}"
          python3 scripts/download_hf_assets.py --repo_id meta-llama/Llama-3.2-1B --assets tokenizer --hf_token="${HF_TOKEN}"

      - name: Build and push nightly image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: torchtitan/experiments/tpu/Dockerfile
          push: ${{ github.event.inputs.push_image != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CACHE_BUSTER=${{ steps.meta.outputs.NIGHTLY_DATE }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            TORCH_VERSION=${{ env.TORCH_VERSION }}

      # Downstream jobs should reference the image by digest. Candidate tags are
      # mutable if this workflow is used to build two runs on the same day, and
      # runners referencing candidate tags may fail to re-pull.
      - name: Compute immutable image reference
        id: ref
        run: |
          set -euo pipefail
          echo "image_ref=${IMAGE_REPO}@${DIGEST}" >> "${GITHUB_OUTPUT}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Print published tags
        run: |
          echo "Published tags (':latest' is added later, by promote-latest):"
          echo "${STEPS_META_OUTPUTS_TAGS}"
        env:
          STEPS_META_OUTPUTS_TAGS: ${{ steps.meta.outputs.tags }}

      - name: Print image Digest
        run: |
          echo "Image Digest:"
          echo "${STEPS_BUILD_OUTPUTS_DIGEST}"
        env:
          STEPS_BUILD_OUTPUTS_DIGEST: ${{ steps.build.outputs.digest }}

  validate-image:
    name: Validate nightly image
    needs: [build-and-push-image]
    if: ${{ github.event.inputs.push_image != 'false' }}
    uses: ./.github/workflows/tpu-test.yml
    with:
      image: ${{ needs.build-and-push-image.outputs.candidate_ref }}
    secrets:
      GAR_JSON_KEY: ${{ secrets.GAR_JSON_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  promote-latest:
    name: Promote nightly image to :latest
    needs: [build-and-push-image]
    if: ${{ needs.build-and-push-image.outputs.promote_latest == 'true' && github.event.inputs.push_image != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      IMAGE_REPO: us-west1-docker.pkg.dev/tpu-pytorch/torchtitan-images/torchtitan-container

    steps:
      - name: Authenticate to Google Cloud via service account key
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          credentials_json: ${{ secrets.GAR_JSON_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2

      - name: Add :latest tag to the validated image
        run: |
          set -euo pipefail
          gcloud artifacts docker tags add "${CANDIDATE_REF}" "${IMAGE_REPO}:latest" --quiet
          echo "Promoted ${CANDIDATE_REF} to ${IMAGE_REPO}:latest"
        env:
          # Promote by digest so we tag the image validate-image actually ran,
          # not whatever the mutable date tag resolves to by now.
          CANDIDATE_REF: ${{ needs.build-and-push-image.outputs.candidate_ref }}
